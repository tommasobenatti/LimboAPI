name: Velocity-CTD CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        ctd: [410, 411]
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2
      - name: Set up JDK 25
        uses: actions/setup-java@v4.7.0
        with:
          distribution: temurin
          java-version: 25
      - name: Download verified Velocity-CTD
        env:
          CTD_BUILD: ${{ matrix.ctd }}
        run: |
          case "$CTD_BUILD" in
            410) checksum=7ec86cab7c4187e84ff0312ef2459bd70f96c5484552142b79b82d7c9d25a05d ;;
            411) checksum=c772d49f3b4d77244ffa028603380d327d6b992e5867c57bde9492da5d1c3f25 ;;
            *) exit 1 ;;
          esac
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/velocity-ctd.jar" "https://github.com/GemstoneGG/Velocity-CTD/releases/download/build-$CTD_BUILD/velocity-ctd-fatjar-4.3.1-SNAPSHOT-$CTD_BUILD.jar"
          echo "$checksum  $RUNNER_TEMP/velocity-ctd.jar" | sha256sum --check
      - name: Download verified upstream mappings
        run: |
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/limboapi-mappings.jar" https://github.com/Elytrium/LimboAPI/releases/download/dev-build/limboapi-1.1.27-SNAPSHOT.jar
          echo "5d541984b90ca7a88eb49ca5f8cc3a803f5ecdfa6d7ed30b605b72ff94156e40  $RUNNER_TEMP/limboapi-mappings.jar" | sha256sum --check
      - name: Build and verify
        run: ./gradlew --no-daemon build "-PvelocityCtdJar=$RUNNER_TEMP/velocity-ctd.jar" "-PmappingsJar=$RUNNER_TEMP/limboapi-mappings.jar"
      - name: Upload jar and test evidence
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: LimboAPI-CTD${{ matrix.ctd }}-${{ github.sha }}
          if-no-files-found: warn
          path: |
            plugin/build/libs/limboapi-*-MCExp-CTD410*.jar
            plugin/build/test-results/test/TEST-*.xml
            plugin/build/reports/checkstyle/*.xml
